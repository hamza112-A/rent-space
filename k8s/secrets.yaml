apiVersion: v1
kind: Secret
metadata:
  name: urdu-rental-secrets
  namespace: urdu-rental
type: Opaque
stringData:
  # IMPORTANT: Replace these with your actual values
  # For production, use external secret management (e.g., Sealed Secrets, Vault)
  
  # MongoDB Credentials
  MONGO_ROOT_USERNAME: "admin"
  MONGO_ROOT_PASSWORD: "change-this-password"
  MONGODB_URI: "mongodb://admin:change-this-password@mongodb-service:27017/urdu_rent_space?authSource=admin"
  
  # JWT Secrets
  JWT_SECRET: "your-super-secret-jwt-key-min-32-chars"
  JWT_REFRESH_SECRET: "your-refresh-token-secret-different"
  
  # Cloudinary
  CLOUDINARY_CLOUD_NAME: "your-cloud-name"
  CLOUDINARY_API_KEY: "your-api-key"
  CLOUDINARY_API_SECRET: "your-api-secret"
  
  # Stripe
  STRIPE_SECRET_KEY: "sk_test_your-stripe-secret"
  VITE_STRIPE_PUBLISHABLE_KEY: "pk_test_your-stripe-publishable"
  STRIPE_WEBHOOK_SECRET: "whsec_your-webhook-secret"
  
  # Email Credentials
  EMAIL_USER: "your-email@gmail.com"
  EMAIL_PASS: "your-app-password"
  
  # Twilio SMS
  TWILIO_ACCOUNT_SID: "your-twilio-sid"
  TWILIO_AUTH_TOKEN: "your-twilio-token"
  TWILIO_PHONE_NUMBER: "+1234567890"
  
  # Session Secret
  SESSION_SECRET: "your-session-secret-key"
  
  # Redis URL
  REDIS_URL: "redis://redis-service:6379"

---
# Note: In production, use Sealed Secrets or External Secrets Operator
# Example with Sealed Secrets:
# kubeseal --format=yaml < secrets.yaml > sealed-secrets.yaml
